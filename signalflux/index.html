<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX::SIGNALFLUX</title>
    <meta name="description" content="File index for SignalFlux project outputs.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --secondary: #6366f1;
            --accent: #22c55e;
            --bg-main: #0a0c10;
            --bg-card: #11141b;
            --border-dim: #1e293b;
            --text-head: #f8fafc;
            --text-body: #cbd5e1;
            --text-mono: #38bdf8;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --font-serif: 'Inter', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            font-family: var(--font-serif);
            line-height: 1.5;
            background-image:
                linear-gradient(rgba(30, 41, 59, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            border: 1px solid var(--border-dim);
            background: rgba(10, 12, 16, 0.9);
            backdrop-filter: blur(4px);
            position: relative;
        }

        /* Scanning Line Effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 45%, rgba(14, 165, 233, 0.05) 50%, transparent 55%);
            background-size: 100% 200%;
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes scan {
            from {
                background-position: 0 100%;
            }

            to {
                background-position: 0 -100%;
            }
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--text-head);
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 1rem;
        }

        .meta {
            font-family: var(--font-mono);
            color: var(--text-mono);
            font-size: 0.8rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .file-list {
            list-style: none;
        }

        .file-item {
            margin-bottom: 1rem;
        }

        .file-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            color: var(--text-head);
            text-decoration: none;
            transition: all 0.2s;
            font-family: var(--font-mono);
            font-size: 0.95rem;
        }

        .file-link:hover {
            border-color: var(--primary);
            background: rgba(14, 165, 233, 0.05);
            transform: translateX(5px);
        }

        .file-icon {
            margin-right: 10px;
            color: var(--secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="meta">DIR: ~/SIGNALFLUX // INDEX_MODE</div>
        <h1>Directory Index</h1>

        <ul class="file-list" id="file-list">
            <!-- Files loaded via script below -->
        </ul>

        <div class="meta"
            style="margin-top: 2rem; border-top: 1px solid var(--border-dim); padding-top: 1rem; text-align: right;">
            <a href="../index.html" style="color: var(--text-mono); text-decoration: none;">[RETURN_ROOT]</a>
        </div>
    </div>

    <script>
        // --- CONFIGURE YOUR FILES HERE ---
        const HTML_FILES = [
            "hk_fire.html",
            "meta_manus.html"
        ];
        // ---------------------------------

        function renderList() {
            const listElement = document.getElementById('file-list');
            listElement.innerHTML = '';

            if (HTML_FILES.length === 0) {
                listElement.innerHTML = '<li class="file-item"><div class="file-link"><span>No reports found.</span></div></li>';
                return;
            }

            HTML_FILES.forEach(fileName => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <a href="${fileName}" class="file-link">
                        <span><i data-lucide="file-code" class="file-icon"></i> ${fileName}</span>
                        <i data-lucide="arrow-right" style="width: 16px;"></i>
                    </a>
                `;
                listElement.appendChild(li);
            });

            lucide.createIcons();
        }

        renderList();
    </script>
</body>

</html>
